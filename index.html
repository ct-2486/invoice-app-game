<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信義區雲端發票冒險島-AI體感與XBOX搖桿雙模版</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
body{
margin:0;overflow:hidden;font-family:"Microsoft JhengHei", sans-serif;
background: linear-gradient(rgba(10, 15, 30, 0.3), rgba(4, 9, 20, 0.65)), url('image.png') center bottom/cover no-repeat fixed;
color: #fff; position: fixed; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none;
}
#overlay{position:fixed;inset:0;background:rgba(255,255,255,.02); pointer-events: none;}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;}

/* AI 視訊預覽小視窗 */
#videoContainer {
    position: absolute; bottom: 15px; left: 15px; width: 160px; height: 120px;
    border: 3px solid #0ff; border-radius: 10px; overflow: hidden; z-index: 2000;
    background: #000; box-shadow: 0 0 15px rgba(0,255,255,0.5);
    transform: scaleX(-1);
}
#webcam { width: 100%; height: 100%; object-fit: cover; }

#score,#timer{
position:absolute;top:15px;z-index:1000;background:rgba(255,255,255,0.9);color:#000;
padding:8px 15px;border-radius:12px;font-size:20px;font-weight:bold;
box-shadow: 0 4px 15px rgba(0,255,255,0.4);
}
@media(min-width: 768px) { #score,#timer { font-size: 28px; padding: 10px 20px; border-radius: 15px; top: 20px; } }
#score{left:15px;} #timer{right:15px;}

#player{
position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
width:150px;height:150px; display:flex;align-items:center;justify-content:center; z-index:500;
transition: left 0.05s ease-out;
}

.item,.monster{
position:absolute;width:75px;height:75px;border-radius:18px;
display:flex;flex-direction:column;align-items:center;justify-content:center; z-index:300;box-sizing:border-box;
}
@media(min-width: 768px) { .item,.monster { width: 90px; height: 90px; border-radius: 22px; } }
.item{ background:rgba(255,255,255,0.95);color:#000;border:3px solid #1976d2; box-shadow:0 8px 20px rgba(0,242,254,.6); }
.item .icon { font-size: 30px; }
.item .text { font-size: 11px; font-weight: bold; color: #1976d2; margin-top: 1px; }
@media(min-width: 768px) { .item .icon { font-size: 38px; } .item .text { font-size: 13px; margin-top: 2px; } }

.monster{ background:rgba(255, 221, 221, 0.95);color:#000;border:3px solid #c62828; box-shadow:0 8px 20px rgba(255,0,0,.5); }
.monster .icon { font-size: 30px; }
.monster .text { font-size: 11px; font-weight: bold; color: #c62828; margin-top: 1px; }
@media(min-width: 768px) { .monster .icon { font-size: 38px; } .monster .text { font-size: 13px; margin-top: 2px; } }

#message{
position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
background:rgba(0,0,0,.88);color:white;padding:12px 25px;
border-radius:15px;display:none;text-align:center;z-index:2000;width:80%;max-width:600px;
font-size: 20px; border: 2px solid #0ff; pointer-events: none;
}

/* 開始畫面排版優化 */
#startScreen{
position:fixed;inset:0;background:rgba(10,15,30,.94);z-index:3000;
display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;color:white;transition:all .5s;padding: 30px;box-sizing: border-box;
}
#startScreen h1{font-size:28px;margin:0 0 10px 0;color:#FFD54F;text-shadow: 0 0 20px rgba(255,213,79,0.4);}
#startScreen h2{font-size:18px;margin:5px 0 25px 0;color:#fff;font-weight:normal;opacity:0.9;}
#startScreen .intro-box{
    font-size:15px; width:100%; max-width:680px; line-height:1.7; 
    background:rgba(255,255,255,0.06); padding: 20px; border-radius: 16px; 
    border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); 
    text-align: left; box-sizing: border-box;
}
#startScreen .intro-line { display: flex; align-items: flex-start; margin-bottom: 10px; }
#startScreen .intro-line:last-child { margin-bottom: 0; }
#startScreen .intro-icon { margin-right: 10px; font-size: 18px; flex-shrink: 0; line-height: 1.7; }
#startScreen .intro-text { flex-grow: 1; }

#startScreen button{
background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);color:white;border:none;padding:12px 45px;font-size:22px;
border-radius:25px;cursor:pointer;margin-top:25px;box-shadow:0 8px 25px rgba(21,101,192,.5);
font-weight: bold; transition: transform 0.2s;
}
#startScreen button:active { transform: scale(0.95); }

@media(min-width: 768px) {
    #startScreen h1 { font-size: 48px; } #startScreen h2 { font-size: 26px; margin-bottom: 35px; }
    #startScreen .intro-box { font-size: 19px; padding: 25px 30px; border-radius: 20px; }
    #startScreen .intro-icon { font-size: 22px; margin-right: 12px; }
    #startScreen button { padding: 16px 60px; font-size: 26px; border-radius: 30px; margin-top: 35px; }
}

/* 結束畫面排版優化 */
#endScreen{
position:fixed;inset:0;background:rgba(5,10,20,.96);z-index:4000;text-align:center;color:white;
display:flex;justify-content:center;align-items:center;flex-direction:column;padding: 30px;box-sizing: border-box;
}
#endScreen h1{font-size:36px;color:#FFD54F;margin:5px 0 10px 0;}
#endScreen h2{font-size:24px;margin:10px 0 20px 0;}
#endScreen button{
background:linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);color:white;border:none;
padding:12px 45px;font-size:22px;border-radius:25px;cursor:pointer;font-weight:bold;
box-shadow:0 8px 25px rgba(21,101,192,.4);
}

#aiStatus { margin-top: 15px; font-size: 14px; color: #90caf9; font-weight: bold; letter-spacing: 0.5px; }

/* 用純 CSS 繪製的立體圓點，100% 解決 iPad 方塊破圖 */
.status-tag { display: inline-flex; align-items: center; font-weight: bold; margin-bottom: 4px; }
.dot-success { width: 10px; height: 10px; background-color: #4caf50; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #4caf50; flex-shrink: 0; }
.dot-fail { width: 10px; height: 10px; background-color: #f44336; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #f44336; flex-shrink: 0; }

/* 結束清單的彈性網格排版，自動對齊 */
.feature-pill-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-left: 18px; }
.feature-pill { background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 20px; font-size: 13px; color: #fff; white-space: nowrap; border: 1px solid rgba(255,255,255,0.15); }
.pill-success { background: rgba(76,175,80,0.15); border-color: rgba(76,175,80,0.3); color: #a5d6a7; }
.pill-fail { background: rgba(244,67,54,0.12); border-color: rgba(244,67,54,0.25); color: #ef9a9a; }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="game">
<div id="score">分數：0</div>
<div id="timer">60 秒</div>
<div id="player">🛸</div>
<div id="message"></div>

<div id="videoContainer">
    <video id="webcam" autoplay playsinline></video>
</div>
</div>

<div id="startScreen">
<h1>信義區雲端發票冒險島</h1>
<h2>🖐️體感 / 🎮搖桿 雙模宣導版</h2>
<div class="intro-box">
    <div style="text-align: center; margin-bottom: 15px; color: #00e5ff; font-weight: bold;">
        你是臺北市稅捐稽徵處信義分處的雲端飛碟！
    </div>
    <div class="intro-line">
        <span class="intro-icon">🖐️</span>
        <span class="intro-text"><b>AI 前鏡頭體感</b>：站在螢幕前 1~1.5 公尺，舉手左右揮動，飛碟就會跟著同步移動。</span>
    </div>
    <div class="intro-line">
        <span class="intro-icon">🎮</span>
        <span class="intro-text"><b>XBOX 搖桿控制</b>：推動【左類比搖桿】或按【十字鍵】、【LB / RB 鍵】即可靈敏控制左右。</span>
    </div>
    <div class="intro-line">
        <span class="intro-icon">📌</span>
        <span class="intro-text">碰綠色功能雲端發票箱 = <span style="color:#4caf50; font-weight:bold;">+10 分</span>，碰紅色紙本發票怪 = <span style="color:#ff5252; font-weight:bold;">-15 分</span>。</span>
    </div>
    <div class="intro-line">
        <span class="intro-icon">🚀</span>
        <span class="intro-text">限時 <b>60 秒內</b> 收集到全部 <b>8 個雲端發票新功能</b> 即可完美通關！</span>
    </div>
</div>
<div id="aiStatus">🤖 AI 視覺模型載入中... 🎮 搖桿等待中...</div>
<button onclick="startGame()">點擊開始遊戲</button>
</div>

<div id="endScreen" style="display:none;">
    <div id="endIcon" style="font-size:55px;margin-bottom:5px;">🎉</div>
    <h1 id="endTitle">恭喜過關！</h1>
    <h2>總分： <span id="finalScore" style="color:#00e5ff;">0</span></h2>
    <div id="collectedList" style="width:100%; max-width:680px; background:rgba(255,255,255,0.04); padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); box-sizing: border-box; font-size:15px; line-height:1.6;"></div>
    <button onclick="restartGame()" style="margin-top:20px;">重新挑戰</button>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreText=document.getElementById("score");
const timerText=document.getElementById("timer");
const message=document.getElementById("message");
const startScreen=document.getElementById("startScreen");
const endScreen=document.getElementById("endScreen");
const aiStatus=document.getElementById("aiStatus");
const videoElement = document.getElementById('webcam');

let score=0, time=60, playerX=window.innerWidth/2 - 75;
let gameStarted=false;
let gameInterval, spawnInterval;
let fallingObjects = [];
let collectedFeatures = new Set();

let joystickSpeed = 16; 

const featureIcons=["📊","🌱","💳","🎁","☁️","📍","🔔","📱"];
const featureNames={"📊":"消費分析","🌱":"減碳存摺","💳":"會員卡管理","🎁":"活動捐贈","☁️":"自動領獎","📍":"領獎地圖","🔔":"智慧通知","📱":"桌面小工具"};

function getObjWidth() { return window.innerWidth >= 768 ? 90 : 75; }

// ==================== 🛸 飛碟造型 UI ====================
player.innerHTML = `
    <div style="width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;">
        <div style="position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:16px;color:#fff;text-shadow:0 0 10px #0ff;font-weight:bold;white-space:nowrap;">稅務飛碟</div>
        <div class="ufo-body" style="width:140px;height:70px;position:relative;animation:float 2s ease-in-out infinite; margin-top:20px;">
            <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:56px;height:35px;background:rgba(0, 242, 254, 0.4);border:3px solid #0ff;border-radius:50% 50% 0 0;z-index:3;"></div>
            <div style="position:absolute;top:22px;left:0;width:140px;height:40px;background:linear-gradient(180deg, #434343 0%, #1a1a1a 100%);border-radius:50%;border:4px solid #555;z-index:2;display:flex;align-items:center;justify-content:space-around;padding:0 15px;box-sizing:border-box;">
                <div class="ufo-light" style="width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;"></div>
                <div class="ufo-light" style="width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;animation-delay:0.3s;"></div>
                <div class="ufo-light" style="width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;animation-delay:0.6s;"></div>
            </div>
            <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:45px;height:12px;background:#0ff;border-radius:50%;z-index:1;box-shadow:0 0 20px #0ff;"></div>
        </div>
    </div>
`;
const pStyle = document.createElement('style');
pStyle.innerHTML = `@keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }`;
document.head.appendChild(pStyle);

function movePlayer(){ player.style.left = playerX + "px"; }
playerX = window.innerWidth / 2 - 75;
movePlayer();

// ==================== 🎮 XBOX 搖桿連線監聽 ====================
let gamepadIndex = null;
window.addEventListener("gamepadconnected", (e) => {
    gamepadIndex = e.gamepad.index;
    updateStatusText("🟢 AI 鏡頭已就緒 ｜ 🎮 XBOX 搖桿連線成功！");
});
window.addEventListener("gamepaddisconnected", (e) => {
    if(gamepadIndex === e.gamepad.index) gamepadIndex = null;
    updateStatusText("🟢 AI 鏡頭已就緒 ｜ ⚪ 搖桿已斷開");
});

function updateStatusText(txt) {
    if(!gameStarted) aiStatus.innerHTML = txt;
}

function handleGamepadInput() {
    if (gamepadIndex === null) return;
    const gamepads = navigator.getGamepads();
    const gp = gamepads[gamepadIndex];
    if (!gp) return;

    let moveDirection = 0;
    if (Math.abs(gp.axes[0]) > 0.2) { moveDirection = gp.axes[0]; }
    else if (gp.buttons[14]?.pressed) { moveDirection = -1; }
    else if (gp.buttons[15]?.pressed) { moveDirection = 1; }
    else if (gp.buttons[4]?.pressed) { moveDirection = -1; }
    else if (gp.buttons[5]?.pressed) { moveDirection = 1; }

    if (moveDirection !== 0) {
        playerX += moveDirection * joystickSpeed;
        playerX = Math.max(0, Math.min(window.innerWidth - 150, playerX));
        movePlayer();
    }

    if (!gameStarted && endScreen.style.display === "flex" && gp.buttons[0]?.pressed) { restartGame(); }
    else if (!gameStarted && startScreen.style.display !== "none" && gp.buttons[0]?.pressed) { startGame(); }
}

// ==================== 🎵 音效與音樂引擎 ====================
let audioCtx = null; let bgmInterval = null; let bgmStep = 0; let currentBpmSpeed = 140;
function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
function playSound(freqs, duration, type = "sine", gainStart = 0.1) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(); let gainNode = audioCtx.createGain();
        osc.type = type; osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        let now = audioCtx.currentTime; gainNode.gain.setValueAtTime(gainStart, now); gainNode.gain.exponentialRampToValueAtTime(0.00001, now + duration);
        if (freqs.length === 1) { osc.frequency.setValueAtTime(freqs[0], now); }
        else {
            osc.frequency.setValueAtTime(freqs[0], now);
            for(let i = 1; i < freqs.length; i++){ osc.frequency.linearRampToValueAtTime(freqs[i], now + (duration * (i / (freqs.length - 1)))); }
        }
        osc.start(now); osc.stop(now + duration);
    } catch (e) {}
}
function playScoreSound() { playSound([587.33, 880, 1174.66], 0.2, "triangle", 0.15); }
function playMonsterSound() { playSound([140, 90, 60], 0.3, "sawtooth", 0.25); }
function playWinSound() { if(!audioCtx) return; let notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((f, i) => { setTimeout(() => { playSound([f, f * 1.2], 0.5, "sine", 0.1); }, i * 80); }); }
function playLoseSound() { playSound([220, 146.83, 110], 0.8, "sawtooth", 0.25); }

function startBGM() {
    stopBGM(); const melody = [440, 440, 523, 440, 587, 440, 523, 493, 392, 392, 493, 392, 523, 392, 493, 440];
    bgmStep = 0; currentBpmSpeed = 140; runBgmLoop(melody);
}
function runBgmLoop(melody) {
    if (!gameStarted) return;
    let f = melody[bgmStep % melody.length];
    let timeModifier = time <= 15 ? 1.25 : (time <= 30 ? 1.1 : 1.0);
    currentBpmSpeed = time <= 15 ? 95 : (time <= 30 ? 115 : 140);
    if (bgmStep % 2 === 0) { playSound([80, 40], 0.15, "triangle", 0.15); }
    playSound([f * timeModifier, f * timeModifier], 0.09, "sine", 0.04);
    bgmStep++; bgmInterval = setTimeout(() => runBgmLoop(melody), currentBpmSpeed);
}
function stopBGM() { if (bgmInterval) { clearTimeout(bgmInterval); bgmInterval = null; } }

// ==================== 🤖 MediaPipe AI 揮手偵測配置 ====================
const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmark = results.multiHandLandmarks[0][9];
        let mirroredX = 1 - landmark.x;
        let targetX = mirroredX * window.innerWidth - 75;
        playerX = Math.max(0, Math.min(window.innerWidth - 150, targetX));
        movePlayer();
    }
});

const camera = new Camera(videoElement, {
    onFrame: async () => { await hands.send({ image: videoElement }); },
    width: 640, height: 480, facingMode: 'user'
});
camera.start().then(() => {
    updateStatusText("AI 前置體感鏡頭已就緒！可以開始遊戲");
}).catch(err => {
    aiStatus.innerHTML = "❌ <span style='color:#ff5722;'>鏡頭啟動失敗，請允許相機權限</span>";
});

// ==================== 核心遊戲邏輯 ====================
function startGame(){
    initAudio();
    startScreen.style.display = "none"; endScreen.style.display = "none";
    score = 0; time = 60; collectedFeatures.clear();
    fallingObjects.forEach(obj => obj.el.remove()); fallingObjects = [];
    
    scoreText.textContent = "分數：" + score;
    timerText.textContent = time + " 秒";
    timerText.style.color = "#000";
    gameStarted = true;
    startBGM();
    
    clearInterval(gameInterval); clearInterval(spawnInterval);
    gameInterval = setInterval(updateGame, 30);
    spawnInterval = setInterval(() => {
        time--;
        timerText.textContent = time + " 秒";
        if(time <= 15) { timerText.style.color = "#ff1744"; }
        if(time <= 0) { endGame(false); return; }
        if(Math.random() < 0.5) { createFeature(); } else { createMonster(); }
    }, 1000);
}

function createFeature(){
    let div = document.createElement("div"); div.className = "item";
    let icon = featureIcons[Math.floor(Math.random() * featureIcons.length)];
    let name = featureNames[icon];
    div.innerHTML = `<span class="icon">${icon}</span><span class="text">${name}</span>`;
    let objW = getObjWidth(); let x = Math.random() * (window.innerWidth - objW);
    div.style.left = x + "px"; div.style.top = "-100px"; game.appendChild(div);
    let speedBonus = (60 - time) * 0.05;
    fallingObjects.push({ el: div, x: x, y: -100, type: "good", icon: icon, name: name, speed: 4 + Math.random() * 4 + speedBonus });
}

function createMonster(){
    let div = document.createElement("div"); div.className = "monster";
    div.innerHTML = `<span class="icon">🧾</span><span class="text">紙本怪</span>`;
    let objW = getObjWidth(); let x = Math.random() * (window.innerWidth - objW);
    div.style.left = x + "px"; div.style.top = "-100px"; game.appendChild(div);
    let speedBonus = (60 - time) * 0.05;
    fallingObjects.push({ el: div, x: x, y: -100, type: "bad", speed: 5 + Math.random() * 4 + speedBonus });
}

function updateGame(){
    handleGamepadInput();
    let nextObjects = [];
    let playerLeft = playerX; let playerRight = playerX + 150;
    let pTop = window.innerHeight - 170; let objW = getObjWidth();
    
    for(let i = 0; i < fallingObjects.length; i++){
        let obj = fallingObjects[i]; obj.y += obj.speed; obj.el.style.top = obj.y + "px";
        
        if(obj.y + objW >= pTop && obj.y <= window.innerHeight - 50 && obj.x + objW >= playerLeft && obj.x <= playerRight){
            if(obj.type === "good"){
                score += 10; collectedFeatures.add(obj.icon); 
                showTicker("收集到功能：" + obj.name + " ➕10"); playScoreSound();
                if(collectedFeatures.size === 8){ endGame(true); }
            } else {
                score = Math.max(0, score - 15);
                showTicker("撞到紙本發票怪！ ➖15"); playMonsterSound();
            }
            scoreText.textContent = "分數：" + score; obj.el.remove();
        } else if(obj.y > window.innerHeight){
            obj.el.remove();
        } else {
            nextObjects.push(obj);
        }
    }
    fallingObjects = nextObjects;
}

function showTicker(txt){
    message.textContent = txt; message.style.display = "block";
    clearTimeout(message.timer); message.timer = setTimeout(() => { message.style.display = "none"; }, 1000);
}

// ==================== 結束畫面：CSS 膠囊小標籤 + 對齊修正 ====================
function endGame(isWin){
    gameStarted = false; stopBGM();
    clearInterval(gameInterval); clearInterval(spawnInterval);
    document.getElementById("finalScore").textContent = score;
    const endIcon = document.getElementById("endIcon");
    const title = document.getElementById("endTitle");
    const list = document.getElementById("collectedList");
    
    let successPills = []; let failPills = [];
    featureIcons.forEach(icon => {
        if(collectedFeatures.has(icon)){ 
            successPills.push(`<span class="feature-pill pill-success">${icon} ${featureNames[icon]}</span>`); 
        } else { 
            failPills.push(`<span class="feature-pill pill-fail">${icon} ${featureNames[icon]}</span>`); 
        }
    });

    if(isWin){
        endIcon.textContent = "🎉"; title.textContent = "恭喜完美過關！"; title.style.color = "#FFD54F";
        list.innerHTML = `
            <div style="color:#4caf50; font-weight:bold; margin-bottom:12px; font-size:18px; text-align:center;">🌟 成功集滿新版APP全部 8 個功能！</div>
            <div class="feature-pill-container" style="justify-content: center; padding-left:0;">
                ${successPills.join('')}
            </div>
        `;
        playWinSound();
    } else {
        endIcon.textContent = "⏰"; title.textContent = "時間到！挑戰失敗"; title.style.color = "#ff5722";
        let htmlContent = `<div style="margin-bottom:15px; font-size:16px; text-align:center;">本次共收集了 <b style="color:#00e5ff; font-size:20px;">${collectedFeatures.size} / 8</b> 種功能：</div>`;
        
        // 已成功蒐集區塊 (使用純 CSS 圓點，杜絕方塊)
        htmlContent += `<div style="margin-bottom:15px;">
            <span class="status-tag" style="color:#4caf50;"><span class="dot-success"></span>👍 已成功蒐集：</span>
            <div class="feature-pill-container">${successPills.length > 0 ? successPills.join('') : '<span style="color:#aaa; font-style:italic;">無</span>'}</div>
        </div>`;
        
        // 未成功蒐集區塊
        htmlContent += `<div>
            <span class="status-tag" style="color:#ff5722;"><span class="dot-fail"></span>❌ 未成功蒐集：</span>
            <div class="feature-pill-container">${failPills.length > 0 ? failPills.join('') : '<span style="color:#aaa; font-style:italic;">無</span>'}</div>
        </div>`;
        
        list.innerHTML = htmlContent;
        playLoseSound();
    }
    endScreen.style.display = "flex";
}

setInterval(() => { if(!gameStarted) handleGamepadInput(); }, 50);
function restartGame(){ endScreen.style.display = "none"; startGame(); }
window.addEventListener("resize", () => { playerX = Math.max(0, Math.min(window.innerWidth - 150, playerX)); movePlayer(); });
</script>
</body>
</html>
